[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-copilot"
version = "0.1.0"
description = "Screens Dutch public tenders and drafts bid/no-bid memos for human approval."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    # Pinned to the newest release older than two weeks (2.14.3, released 5 Nov 2026, is newer).
    "pydantic==2.14.2",
    # Provider SDKs, imported only in llm/providers/. Newest releases before the lock cutoff.
    "anthropic==2.3.0",
    "mistralai==3.6.0",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = [
    "ingest", "rag", "llm", "llm.providers", "pipeline", "agent", "jobs", "app", "crm", "evals",
]

[tool.uv]
# Only packages released before this date are resolved (two-week rule in CLAUDE.md / DECISIONS.md).
exclude-newer = "2026-10-30T00:00:00Z"

[tool.ruff]
target-version = "py312"
line-length = 100
# Lint and format Python files only; the docs hold illustrative code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
